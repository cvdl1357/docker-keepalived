name: Build and Publish keepalived

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'docker-compose.yml'
      - 'README.md'
      - 'DOCKER_README.md'
      - '.github/workflows/docker-publish.yml'

  # Weekly scheduled build (Runs every Sunday at 02:00 UTC)
  schedule:
    - cron: '0 2 * * 0'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch latest Keepalived release version
        id: version
        run: |
          TAG=$(git ls-remote --tags --sort=-v:refname https://github.com/acassen/keepalived.git 'v*' \
            | grep -v '\^{}' \
            | head -n1 \
            | sed 's|.*refs/tags/v||')
          if [ -z "$TAG" ]; then
            echo "ERROR: Could not resolve latest Keepalived tag" >&2
            exit 1
          fi
          echo "keepalived_version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Detected Keepalived version: ${TAG}"

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hardened Images (dhi.io)
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/keepalived
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.keepalived_version }},enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            KEEPALIVED_VERSION=${{ steps.version.outputs.keepalived_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/keepalived
          short-description: "Unofficial lightweight, multi-arch VRRP-only Keepalived container built on Docker Hardened Images (Alpine)."
          readme-filepath: ./DOCKER_README.md
          enable-url-completion: true
